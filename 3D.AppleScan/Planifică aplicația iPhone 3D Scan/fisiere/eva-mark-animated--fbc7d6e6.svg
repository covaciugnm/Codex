<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title"><title id="title">EVA-3dScan — animated scan mark</title><style>.beam{animation:scan 3.6s ease-in-out infinite}.dot{animation:pulse 1.8s ease-in-out infinite}@keyframes scan{0%,100%{transform:translateY(-27px);opacity:0}20%,80%{opacity:1}50%{transform:translateY(27px)}}@keyframes pulse{50%{opacity:.4}}@media(prefers-reduced-motion:reduce){.beam,.dot{animation:none}.beam{opacity:.6}}</style><rect width="128" height="128" rx="29" fill="#2549eb"/><path d="M21 43V22h22m42 0h22v21m0 42v22H85m-42 0H21V85" stroke="#bafff3" stroke-width="3" fill="none" stroke-linecap="round"/><path d="m40 41 42-6 10 7-42 6Zm0 21 31-4 10 7-31 4Zm0 21 42-6 10 7-42 6Z" fill="#68f0dc"/><path d="M40 41v42l10 7V48Z" fill="white"/><path class="beam" d="M28 64h72" stroke="#fff" stroke-width="2" opacity=".8"/><circle class="dot" cx="102" cy="27" r="5" fill="#ff825d"/></svg>
